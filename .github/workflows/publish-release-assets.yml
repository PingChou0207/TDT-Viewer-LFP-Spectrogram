name: Publish v4.1.0 release assets

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download verified Windows and macOS archives
        run: |
          set -euo pipefail
          gh run download 37427032180 -n TDT_viewer_video_spectrogram_v4_Windows_x64 -D release-assets/windows
          gh run download 37427032180 -n TDT_viewer_video_spectrogram_v4_macOS_arm64 -D release-assets/macos
          test -s release-assets/windows/TDT_viewer_video_spectrogram_v4_Windows_x64.zip
          test -s release-assets/macos/TDT_viewer_video_spectrogram_v4_macOS_arm64.zip
      - name: Attach archives to the published release
        run: |
          set -euo pipefail
          gh release upload v4.1.0 \
            release-assets/windows/TDT_viewer_video_spectrogram_v4_Windows_x64.zip \
            release-assets/macos/TDT_viewer_video_spectrogram_v4_macOS_arm64.zip \
            --clobber
