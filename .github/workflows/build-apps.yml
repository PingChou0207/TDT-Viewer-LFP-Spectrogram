name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - shell: cmd
        run: |
          set PYQTGRAPH_QT_LIB=PySide6
          python -m PyInstaller --noconfirm --clean TDT_viewer_video_spectrogram_v4.spec
      - shell: powershell
        run: Compress-Archive -Path 'dist\TDT_viewer_video_spectrogram_v4' -DestinationPath 'dist\TDT_viewer_video_spectrogram_v4_Windows_x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TDT_viewer_video_spectrogram_v4_Windows_x64
          path: dist/TDT_viewer_video_spectrogram_v4_Windows_x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-build.txt
      - run: python -m pip install -r requirements-build.txt
      - run: |
          export PYQTGRAPH_QT_LIB=PySide6
          python -m PyInstaller --noconfirm --clean TDT_viewer_video_spectrogram_v4.spec
          codesign --force --deep --sign - "dist/TDT_viewer_video_spectrogram_v4.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/TDT_viewer_video_spectrogram_v4.app" "dist/TDT_viewer_video_spectrogram_v4_macOS_arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TDT_viewer_video_spectrogram_v4_macOS_arm64
          path: dist/TDT_viewer_video_spectrogram_v4_macOS_arm64.zip
