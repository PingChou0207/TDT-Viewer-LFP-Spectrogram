name: Build desktop apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements-build.txt
      - shell: cmd
        run: |
          set PYQTGRAPH_QT_LIB=PySide6
          python -m PyInstaller --noconfirm --clean TDT_Viewer_LFP_Spectrogram_v3.spec
      - shell: powershell
        run: Compress-Archive -Path 'dist\TDT Viewer LFP Spectrogram v3' -DestinationPath 'dist\TDT_Viewer_LFP_Spectrogram_v3_Windows_x64.zip' -Force
      - uses: actions/upload-artifact@v4
        with:
          name: TDT-Viewer-Spectrogram-v3-Windows-x64
          path: dist/TDT_Viewer_LFP_Spectrogram_v3_Windows_x64.zip

  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements-build.txt
      - run: |
          export PYQTGRAPH_QT_LIB=PySide6
          python -m PyInstaller --noconfirm --clean TDT_Viewer_LFP_Spectrogram_v3.spec
          codesign --force --deep --sign - "dist/TDT Viewer LFP Spectrogram v3.app"
          ditto -c -k --sequesterRsrc --keepParent "dist/TDT Viewer LFP Spectrogram v3.app" "dist/TDT_Viewer_LFP_Spectrogram_v3_macOS_arm64.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: TDT-Viewer-Spectrogram-v3-macOS
          path: dist/TDT_Viewer_LFP_Spectrogram_v3_macOS_arm64.zip
